<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeeva Assistant | Infinite Core</title>
    <style>
        :root {
            --bg-dark: #070a13;
            --bg-card: #111827;
            --accent: #10b981;
            --text: #f8fafc;
            --text-muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { text-align: center; padding: 20px; background: var(--bg-card); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        header h1 span { color: var(--accent); }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 15px; }
        .row { display: flex; width: 100%; }
        .user-row { justify-content: flex-end; }
        .jeeva-row { justify-content: flex-start; }
        .bubble { max-width: 75%; padding: 12px 18px; border-radius: 15px; line-height: 1.5; font-size: 1rem; white-space: pre-wrap; }
        .user-row .bubble { background: #2563eb; border-bottom-right-radius: 2px; }
        .jeeva-row .bubble { background: var(--bg-card); border: 1px solid #2d3748; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px 15%; background: var(--bg-dark); }
        .input-box { background: var(--bg-card); border-radius: 30px; display: flex; padding: 5px 5px 5px 20px; border: 1px solid #2d3748; }
        .input-box input { flex: 1; background: none; border: none; outline: none; color: white; font-size: 1rem; }
        .input-box button { background: var(--accent); border: none; color: #000; font-weight: bold; padding: 10px 20px; border-radius: 25px; cursor: pointer; }
        .loader { display: none; color: var(--accent); text-align: center; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>🤖 Jeeva<span> Assistant</span></h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Infinite Global Brain Connected</p>
    </header>

    <div class="chat-area" id="chatLogs">
        <div class="row jeeva-row">
            <div class="bubble">Yo! I am **Jeeva Assistant**, your personal AI friend. My global brain is fully online. Ask me to teach you a school subject, write code, or just chat. Let's get it!</div>
        </div>
    </div>

    <div class="input-area">
        <div class="loader" id="loadingText">Jeeva is thinking deeply...</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask absolutely anything..." onkeydown="if(event.key === 'Enter') askJeeva()">
            <button onclick="askJeeva()">Send</button>
        </div>
    </div>

    <script>
        let chatHistory = [
            { role: "system", content: "You are Jeeva Assistant, a brilliant, super smart, and down-to-earth AI friend. Speak casually to the user like a peer (use words like 'bro', 'yo', 'cool'), but give incredibly accurate, detailed, and insightful answers. You remember the conversation history, learn from your mistakes, and can teach any subject or write any code perfectly." }
        ];

        async function askJeeva() {
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            if (!userText) return;

            appendBubble(userText, 'user-row');
            inputField.value = "";
            
            const loader = document.getElementById('loadingText');
            loader.style.display = "block";

            chatHistory.push({ role: "user", content: userText });

            try {
                // Connecting to a clean, unrestricted public endpoint
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: chatHistory,
                        model: "openai-large"
                    })
                });

                if (!response.ok) throw new Error("Server busy");

                const aiReply = await response.text();
                loader.style.display = "none";

                chatHistory.push({ role: "assistant", content: aiReply });
                appendBubble(aiReply, 'jeeva-row');

            } catch (error) {
                // AUTOMATIC BACKUP ROUTE if the primary path fails
                try {
                    const altResponse = await fetch("https://open-api.replicate.workers.dev/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "meta-llama-3-8b-instruct",
                            messages: chatHistory
                        })
                    });
                    const data = await altResponse.json();
                    loader.style.display = "none";
                    const altReply = data.choices[0].message.content;
                    
                    chatHistory.push({ role: "assistant", content: altReply });
                    appendBubble(altReply, 'jeeva-row');
                } catch (innerError) {
                    loader.style.display = "none";
                    appendBubble("Ah damn bro, something blocked the cloud sync. Try refreshing the page!", 'jeeva-row');
                }
            }
        }

        function appendBubble(text, rowClass) {
            const logs = document.getElementById('chatLogs');
            const row = document.createElement('div');
            row.className = `row ${rowClass}`;
            let cleanText = text.replace(/\*\*(.*?)\*\"/g, '<b>$1</b>'); 
            row.innerHTML = `<div class="bubble">${cleanText}</div>`;
            logs.appendChild(row);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
