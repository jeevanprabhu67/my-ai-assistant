<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeeva Assistant | Multi-Core Pro</title>
    <style>
        :root {
            --bg-dark: #060913;
            --bg-card: #0f1626;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --user-blue: #2563eb;
            --text: #f8fafc;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.06);
        }

        /* Thinking Mode Theme override classes */
        body.thinking-theme {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        header { 
            background: rgba(15, 22, 38, 0.7); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); 
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }
        
        .brand h1 { font-size: 1.3rem; font-weight: 700; }
        .brand h1 span { color: var(--accent); transition: color 0.3s ease; text-shadow: 0 0 10px var(--accent-glow); }
        .brand p { color: var(--text-muted); font-size: 0.8rem; }

        /* Mode Switcher UI */
        .toggle-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 30px;
            display: flex;
            border: 1px solid var(--border);
            position: relative;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .mode-btn.active {
            color: #fff;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 25px 20%; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .chat-area { padding: 20px 5%; }
        }

        .row { display: flex; width: 100%; opacity: 0; transform: translateY(12px); animation: popIn 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }
        
        .user-row { justify-content: flex-end; }
        .jeeva-row { justify-content: flex-start; }
        
        .bubble { 
            max-width: 78%; 
            padding: 14px 20px; 
            border-radius: 20px; 
            line-height: 1.6; 
            font-size: 0.98rem; 
            white-space: pre-wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .user-row .bubble { 
            background: linear-gradient(135deg, var(--user-blue), #1d4ed8); 
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        
        .jeeva-row .bubble { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-bottom-left-radius: 4px;
        }

        .input-area { 
            padding: 20px 20%; 
            background: linear-gradient(to top, var(--bg-dark) 70%, transparent);
        }
        @media (max-width: 900px) {
            .input-area { padding: 15px 5%; }
        }

        .input-box { 
            background: var(--bg-card); 
            border-radius: 35px; 
            display: flex; 
            padding: 6px 6px 6px 22px; 
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .input-box input { 
            flex: 1; 
            background: none; 
            border: none; 
            outline: none; 
            color: white; 
            font-size: 1rem; 
        }
        .input-box input::placeholder { color: #4b5563; }
        
        .input-box button { 
            background: var(--accent); 
            border: none; 
            color: #000; 
            font-weight: 700; 
            padding: 0 24px; 
            height: 46px;
            border-radius: 23px; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .input-box button:hover { transform: scale(1.02); }
        
        .loader { 
            display: none; 
            color: var(--accent); 
            text-align: center; 
            font-style: italic; 
            margin-bottom: 12px; 
            font-size: 0.9rem;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>🤖 Jeeva<span> Assistant</span></h1>
            <p id="coreLabel">Turbo Fast Core Active</p>
        </div>
        <div class="toggle-container">
            <button class="mode-btn active" id="fastBtn" onclick="setMode('fast')">⚡ Fast</button>
            <button class="mode-btn" id="thinkBtn" onclick="setMode('thinking')">🧠 Thinking</button>
        </div>
    </header>

    <div class="chat-area" id="chatLogs">
        <div class="row jeeva-row">
            <div class="bubble">Yo! I am **Jeeva Assistant**. 

            I now have dual-engine layouts online! Switch to **Fast Mode** for instant talk, or flip to **Thinking Mode** when you want me to unlock deep analytical processing chains, bro. What are we building?</div>
        </div>
    </div>

    <div class="input-area">
        <div class="loader" id="loadingText">⚡ Jeeva is flying...</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask absolutely anything..." onkeydown="if(event.key === 'Enter') askJeeva()">
            <button onclick="askJeeva()">Send</button>
        </div>
    </div>

    <script>
        let currentMode = 'fast';
        let chatHistory = [];

        function setMode(mode) {
            currentMode = mode;
            const body = document.body;
            const label = document.getElementById('coreLabel');
            const loader = document.getElementById('loadingText');
            
            document.getElementById('fastBtn').classList.remove('active');
            document.getElementById('thinkBtn').classList.remove('active');

            if (mode === 'fast') {
                document.getElementById('fastBtn').classList.add('active');
                body.classList.remove('thinking-theme');
                label.innerText = "Turbo Fast Core Active";
                loader.innerText = "⚡ Jeeva is flying...";
            } else {
                document.getElementById('thinkBtn').classList.add('active');
                body.classList.add('thinking-theme');
                label.innerText = "Deep Neural Chain Active";
                loader.innerText = "🧠 Jeeva is processing logical matrices...";
            }
        }

        async function askJeeva() {
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            if (!userText) return;

            appendBubble(userText, 'user-row');
            inputField.value = "";
            
            const loader = document.getElementById('loadingText');
            loader.style.display = "block";

            // Establish local background configuration system frames
            let systemContext = "";
            if (currentMode === 'fast') {
                systemContext = "You are Jeeva Assistant in FAST MODE. Be brilliant, super smart, and speak casually like a cool peer (use 'bro', 'yo'). Give highly accurate, super quick, snappy, punchy, and brief replies. You know all about pop culture, celebs, Thalapathy Vijay, games, and code.";
            } else {
                systemContext = "You are Jeeva Assistant in THINKING MODE. Speak casually like a peer (use 'bro', 'yo') but perform intense, highly detailed, deep logical breakdowns. Explain things completely step-by-step. Show deep computational mastery on any school subject, code optimization, or general fact. Do not rush.";
            }

            // Build a clean pipeline history sequence
            let activeMessages = [
                { role: "system", content: systemContext },
                ...chatHistory,
                { role: "user", content: userText }
            ];

            try {
                const parts = ['h','t','t','p','s',':','/','/','t','e','x','t','.','p','o','l','l','i','n','a','t','i','o','n','s','.','a','i','/'];
                const targetUrl = parts.join('');

                const response = await fetch(targetUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: activeMessages,
                        model: "openai"
                    })
                });

                if (!response.ok) throw new Error("Stream broke");

                const aiReply = await response.text();
                loader.style.display = "none";
                
                chatHistory.push({ role: "user", content: userText });
                chatHistory.push({ role: "assistant", content: aiReply });
                
                appendBubble(aiReply, 'jeeva-row');

            } catch (error) {
                loader.style.display = "none";
                appendBubble("Ah damn bro, the server matrix flickered. Try hitting send again!", 'jeeva-row');
                console.error(error);
            }
        }

        function appendBubble(text, rowClass) {
            const logs = document.getElementById('chatLogs');
            const row = document.createElement('div');
            row.className = `row ${rowClass}`;
            
            let cleanText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); 
            
            row.innerHTML = `<div class="bubble">${cleanText}</div>`;
            logs.appendChild(row);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
