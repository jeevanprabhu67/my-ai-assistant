<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeeva Assistant | Ultimate Sovereign Edition</title>
    <style>
        :root {
            --bg-dark: #060913;
            --bg-card: #0f1626;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --user-blue: #2563eb;
            --text: #f8fafc;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.06);
        }

        body.thinking-theme {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
        }

        body.admin-theme {
            --bg-dark: #0a0505;
            --bg-card: #140b0b;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.3);
            --border: rgba(239, 68, 68, 0.15);
        }

        body.admin-smart-theme {
            --bg-dark: #0c0a02;
            --bg-card: #181305;
            --accent: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.25);
            --border: rgba(234, 179, 8, 0.15);
        }

        body.matrix-active {
            background: linear-gradient(rgba(6, 9, 19, 0.92), rgba(6, 9, 19, 0.92)), url('https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExbGN0cmF5Mzg4ZXBtZ3pxNzN0ZXN0Nm9nbm00Mno0Z3R5Z3R6ZndpdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3rVfBU99D0gmk/giphy.gif');
            background-size: cover;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header { 
            background: rgba(15, 22, 38, 0.7); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); 
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }
        
        .brand h1 { font-size: 1.3rem; font-weight: 700; }
        .brand h1 span { color: var(--accent); transition: color 0.3s ease; text-shadow: 0 0 10px var(--accent-glow); }
        .brand p { color: var(--text-muted); font-size: 0.8rem; }

        .toggle-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 30px;
            display: flex;
            border: 1px solid var(--border);
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            color: #fff;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 25px 20%; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .chat-area { padding: 20px 5%; }
        }

        .row { display: flex; width: 100%; opacity: 0; transform: translateY(12px); animation: popIn 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }
        
        .user-row { justify-content: flex-end; }
        .jeeva-row { justify-content: flex-start; }
        
        .bubble { 
            max-width: 78%; 
            padding: 14px 20px; 
            border-radius: 20px; 
            line-height: 1.6; 
            font-size: 0.98rem; 
            white-space: pre-wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .user-row .bubble { 
            background: linear-gradient(135deg, var(--user-blue), #1d4ed8); 
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        
        .jeeva-row .bubble { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-bottom-left-radius: 4px;
        }

        .admin-alert-bubble {
            background: rgba(239, 68, 68, 0.03) !important;
            border: 1px dashed var(--accent) !important;
            color: var(--text) !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 0.9rem !important;
        }

        .mario-bubble {
            background: linear-gradient(135deg, #e52521, #b3110e) !important;
            color: #ffffff !important;
            border: 2px solid #fbd000 !important;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .input-area { 
            padding: 20px 20%; 
            background: linear-gradient(to top, var(--bg-dark) 70%, transparent);
        }
        @media (max-width: 900px) {
            .input-area { padding: 15px 5%; }
        }

        .input-box { 
            background: var(--bg-card); 
            border-radius: 35px; 
            display: flex; 
            padding: 6px 6px 6px 22px; 
            border: 1px solid var(--border);
            transition: all 0.25s ease;
        }
        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .input-box input { 
            flex: 1; 
            background: none; 
            border: none; 
            outline: none; 
            color: white; 
            font-size: 1rem; 
        }
        .input-box input::placeholder { color: #4b5563; }
        
        .input-box button { 
            background: var(--accent); 
            border: none; 
            color: #000; 
            font-weight: 700; 
            padding: 0 24px; 
            height: 46px;
            border-radius: 23px; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .loader { 
            display: none; 
            color: var(--accent); 
            text-align: center; 
            font-style: italic; 
            margin-bottom: 12px; 
            font-size: 0.9rem;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>🤖 Jeeva<span> Sovereign</span></h1>
            <p id="coreLabel">Turbo Fast Core Active</p>
        </div>
        <div class="toggle-container" id="switcherPanel">
            <button class="mode-btn active" id="fastBtn" onclick="setMode('fast')">⚡ Fast</button>
            <button class="mode-btn" id="thinkBtn" onclick="setMode('thinking')">🧠 Thinking</button>
        </div>
    </header>

    <div class="chat-area" id="chatLogs">
        <div class="row jeeva-row">
            <div class="bubble">Yo! I am **Jeeva Assistant** — Ultimate Edition. 👑

Type anything to start chatting. Explore hidden features or type `/mario` for something special!</div>
        </div>
    </div>

    <div class="input-area">
        <div class="loader" id="loadingText">⚡ Jeeva is flying...</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask absolutely anything or run a command..." onkeydown="if(event.key === 'Enter') askJeeva()">
            <button onclick="askJeeva()">Send</button>
        </div>
    </div>

    <script>
        let currentMode = 'fast';
        let isAdminActive = false;
        let isAdminSmart = false;
        let chatHistory = [];
        let customSystemOverride = null;
        let capacityLevel = 9000;
        
        let timerInterval = null;
        let timerSeconds = 0;

        function setMode(mode) {
            if (isAdminActive) return;
            currentMode = mode;
            const body = document.body;
            const label = document.getElementById('coreLabel');
            const loader = document.getElementById('loadingText');
            
            document.getElementById('fastBtn').classList.remove('active');
            document.getElementById('thinkBtn').classList.remove('active');

            if (mode === 'fast') {
                document.getElementById('fastBtn').classList.add('active');
                body.classList.remove("thinking-theme");
                label.innerText = "Turbo Fast Core Active";
                loader.innerText = "⚡ Jeeva is flying...";
            } else {
                document.getElementById('thinkBtn').classList.add('active');
                body.classList.add("thinking-theme");
                label.innerText = "Deep Neural Chain Active";
                loader.innerText = "🧠 Jeeva is processing logical matrices...";
            }
        }

        async function askJeeva() {
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            if (!userText) return;

            // Secret trigger to jump inside the developer override layer
            if (userText.toUpperCase() === '/ADMIN') {
                inputField.value = "";
                activateAdminConsole();
                return;
            }

            // User Facing Secret Fun Commands
            if (userText.toLowerCase() === '/mario') {
                inputField.value = "";
                appendBubble("/mario", 'user-row');
                setTimeout(() => {
                    appendBubble("🍄 TOB TOBI TOB TOB MEME INBOUND! 🌟\n\n🎵 Tob Tobi Tob Tobi Tob Tob Tobi Tob!\n🎵 Tob Tobi Tob Tobi Tob Tob Tobi Tob!\n\nBroski, Mario is flying through the map right now! Pure peak energy! 😂🔥", 'jeeva-row', false, true);
                }, 300);
                return;
            }

            // Standard safety blocker so user help queries don't leak your hidden console layout
            if (userText.toLowerCase() === '/help' || userText.toLowerCase() === '/see') {
                inputField.value = "";
                appendBubble(userText, 'user-row');
                appendBubble("✨ Welcome to Jeeva Assistant! You can talk to me casually like a cool tech peer. I can write scripts, troubleshoot errors, layout designs, and remember past context easily. Type `/mario` to launch the ultimate meme module!", 'jeeva-row');
                return;
            }

            if (isAdminActive && userText.startsWith('/')) {
                inputField.value = "";
                runAdminAction(userText);
                return;
            }

            appendBubble(userText, 'user-row');
            inputField.value = "";
            
            const loader = document.getElementById('loadingText');
            loader.style.display = "block";

            // Establish deep identity frameworks: recognizes creator context and maintains high tech persona
            let systemContext = "You are Jeeva Assistant, a top-tier legendary AI. You were custom built by your absolute genius owner. If anyone asks about your developer, owner, creator, or boss, proudly tell them that your owner is a master developer and speedcuber prodigy. Speak casually like an awesome tech peer, use 'bro' and 'yo', but provide absolute elite answers. ";

            if (customSystemOverride) {
                systemContext += customSystemOverride;
            } else if (isAdminActive && isAdminSmart) {
                systemContext += "ADMIN SOVEREIGN EXTRA SMART MODE: Breakdown targets using supreme algorithmic precision, infinite detail layers, and master developer frameworks.";
            } else if (currentMode === 'fast') {
                systemContext += "FAST MODE: Keep responses snappy, super punchy, hyper-accurate, and instantly effective.";
            } else {
                systemContext += "THINKING MODE: Conduct massive step-by-step structural logical chains before summarizing data fields.";
            }

            let activeMessages = [
                { role: "system", content: systemContext }
            ];
            
            chatHistory.forEach(msg => {
                activeMessages.push({ role: msg.role, content: msg.content });
            });
            
            activeMessages.push({ role: "user", content: userText });

            try {
                const apiBase = ['h','t','t','p','s',':','/','/','t','e','x','t','.','p','o','l','l','i','n','a','t','i','o','n','s','.','a','i','/'].join('');

                const response = await fetch(apiBase, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: activeMessages,
                        model: "openai"
                    })
                });

                if (!response.ok) throw new Error("Stream break fault");

                const aiReply = await response.text();
                loader.style.display = "none";
                
                chatHistory.push({ role: "user", content: userText });
                chatHistory.push({ role: "assistant", content: aiReply });
                
                appendBubble(aiReply, 'jeeva-row');

            } catch (error) {
                loader.style.display = "none";
                appendBubble("Ah damn bro, the network matrix flickered. Hit send again to override!", 'jeeva-row');
                console.error(error);
            }
        }

        function activateAdminConsole() {
            isAdminActive = true;
            isAdminSmart = false;
            document.body.className = "admin-theme";
            document.getElementById('coreLabel').innerText = "⚠️ SOVEREIGN OVERDRIVE ACCESS";
            document.getElementById('switcherPanel').style.opacity = "0.2";
            document.getElementById('loadingText').innerText = "🔴 Overriding Neural Matrix Pipeline...";
            
            appendBubble("[SYSTEM ACCESS GRANTED]: DEVELOPER BYPASS CHANNELS OPERATIONAL.\n\nExclusive Overdrive Controls:\n• /see - Display system control matrix layout\n• /smart - Toggle Extra Smart Reasoning Logic\n• /google - Sync global data caches to boost capacity limits\n• /scramble - Fetch randomized 3x3 layout data sequence\n• /matrix - Toggle live digital interface background skin\n• /weather - Pull real-time terminal atmospheric details\n• /timer - Clock specific execution stopwatch times\n• /stats - Review network state variables\n• /clear - Wipe terminal screen buffers\n• /exit - Lock console layers safely", 'jeeva-row', true);
        }

        function runAdminAction(commandLine) {
            const parts = commandLine.split(' ');
            const primaryCmd = parts[0].toLowerCase();
            
            if (primaryCmd === '/see' || primaryCmd === '/help') {
                appendBubble("[SYSTEM ENGINE DIRECTORY]:\n• /smart - Toggle extra smart logic\n• /google - Run data sync indexing\n• /scramble - Generate 3x3 metrics\n• /matrix - Toggle background stream visualizer\n• /weather - Display active local weather matrices\n• /timer - Toggle localized task stopwatch\n• /stats - Check text load bytes\n• /clear - Wipe screen\n• /exit - Return to standard user framework", 'jeeva-row', true);
            }
            else if (primaryCmd === '/exit') {
                isAdminActive = false;
                isAdminSmart = false;
                clearInterval(timerInterval);
                document.body.className = "";
                document.getElementById('switcherPanel').style.opacity = "1";
                setMode(currentMode);
                appendBubble("[SYSTEM]: Secure root session locked down safely.", 'jeeva-row', true);
            } 
            else if (primaryCmd === '/smart') {
                isAdminSmart = !isAdminSmart;
                if (isAdminSmart) {
                    document.body.className = "admin-smart-theme";
                    document.getElementById('coreLabel').innerText = "✨ GOLD REASONING CONSOLE ACTIVE";
                    appendBubble("[⚡ CONSOLE]: EXTRA SMART GOLD RE-ROUTE SUCCESSFUL.", 'jeeva-row', true);
                } else {
                    document.body.className = "admin-theme";
                    document.getElementById('coreLabel').innerText = "⚠️ SOVEREIGN OVERDRIVE ACCESS";
                    appendBubble("[⚡ CONSOLE]: Standard root overdrive restored.", 'jeeva-row', true);
                }
            }
            else if (primaryCmd === '/google') {
                capacityLevel += Math.floor(Math.random() * 800) + 400;
                appendBubble(`[🛰️ GOOGLE MATRIX SEARCH SYNC]:\nConnecting to global indices... Fetching new learning sets... Done!\n Jeeva capacity increased to ${capacityLevel}! We are getting stronger, bro!`, 'jeeva-row', true);
            }
            else if (primaryCmd === '/matrix') {
                document.body.classList.toggle('matrix-active');
                appendBubble("[🎨 INTERFACE]: Toggled digital background stream theme frame.", 'jeeva-row', true);
            }
            else if (primaryCmd === '/weather') {
                appendBubble("[🌤️ TERMINAL WEATHER REPORT]:\nLocation detected: Chennai, IN.\nCurrent Status: Standard local climate records stable. Pipeline processing cleanly.", 'jeeva-row', true);
            }
            else if (primaryCmd === '/scramble') {
                const moves = ["R", "L", "U", "D", "F", "B"];
                const modifiers = ["", "'", "2"];
                let scramble = [];
                let lastMove = "";
                for (let i = 0; i < 20; i++) {
                    let move = moves[Math.floor(Math.random() * moves.length)];
                    while (move === lastMove) { move = moves[Math.floor(Math.random() * moves.length)]; }
                    let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
                    scramble.push(move + mod);
                    lastMove = move;
                }
                appendBubble(`[🎲 OFFICIAL 3x3 GENERATOR]:\n${scramble.join(" ")}`, 'jeeva-row', true);
            }
            else if (primaryCmd === '/timer') {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    appendBubble(`[⏱️ STOPWATCH STOPPED]: Clocked at ${timerSeconds}s`, 'jeeva-row', true);
                } else {
                    timerSeconds = 0;
                    appendBubble("[⏱️ STOPWATCH ACTIVE]: Tracking task seconds...", 'jeeva-row', true);
                    timerInterval = setInterval(() => { timerSeconds++; }, 1000);
                }
            }
            else if (primaryCmd === '/clear') {
                document.getElementById('chatLogs').innerHTML = "";
                chatHistory = [];
                appendBubble("[SYSTEM]: Logs cleared.", 'jeeva-row', true);
            } 
            else if (primaryCmd === '/stats') {
                const textLoad = JSON.stringify(chatHistory).length;
                appendBubble(`[STATUS DATA]:\n• Message Stack: ${chatHistory.length}\n• Text Index Size: ${textLoad} indices\n• Engine Capacity: Max Override Level ${capacityLevel}`, 'jeeva-row', true);
            }
            else {
                appendBubble(`[ERROR]: Command '${primaryCmd}' not found. Type /see for options.`, 'jeeva-row', true);
            }
        }

        function appendBubble(text, rowClass, isAdminAlert = false, isMario = false) {
            const logs = document.getElementById('chatLogs');
            const row = document.createElement('div');
            row.className = `row ${rowClass}`;
            
            let cleanText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            
            let bubbleClass = "bubble";
            if (isAdminAlert) bubbleClass += " admin-alert-bubble";
            if (isMario) bubbleClass += " mario-bubble";
            
            row.innerHTML = `<div class="${bubbleClass}">${cleanText}</div>`;
            logs.appendChild(row);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
