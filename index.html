<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeeva Assistant | Multi-Core Pro</title>
    <style>
        :root {
            --bg-dark: #060913;
            --bg-card: #0f1626;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --user-blue: #2563eb;
            --text: #f8fafc;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.06);
        }

        body.thinking-theme {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
        }

        /* Standard Admin Mode Theme */
        body.admin-theme {
            --bg-dark: #0a0505;
            --bg-card: #140b0b;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.3);
            --border: rgba(239, 68, 68, 0.15);
        }

        /* Extra Smart Admin Mode Theme */
        body.admin-smart-theme {
            --bg-dark: #0c0a02;
            --bg-card: #181305;
            --accent: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.25);
            --border: rgba(234, 179, 8, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header { 
            background: rgba(15, 22, 38, 0.7); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); 
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            transition: border 0.3s ease;
        }
        
        .brand h1 { font-size: 1.3rem; font-weight: 700; }
        .brand h1 span { color: var(--accent); transition: color 0.3s ease; text-shadow: 0 0 10px var(--accent-glow); }
        .brand p { color: var(--text-muted); font-size: 0.8rem; transition: color 0.3s ease; }

        .toggle-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 30px;
            display: flex;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            color: #fff;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 25px 20%; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .chat-area { padding: 20px 5%; }
        }

        .row { display: flex; width: 100%; opacity: 0; transform: translateY(12px); animation: popIn 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }
        
        .user-row { justify-content: flex-end; }
        .jeeva-row { justify-content: flex-start; }
        
        .bubble { 
            max-width: 78%; 
            padding: 14px 20px; 
            border-radius: 20px; 
            line-height: 1.6; 
            font-size: 0.98rem; 
            white-space: pre-wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .user-row .bubble { 
            background: linear-gradient(135deg, var(--user-blue), #1d4ed8); 
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        
        .jeeva-row .bubble { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-bottom-left-radius: 4px;
            transition: all 0.3s ease;
        }

        .admin-alert-bubble {
            background: rgba(239, 68, 68, 0.05) !important;
            border: 1px dashed var(--accent) !important;
            color: var(--text) !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 0.9rem !important;
        }

        .input-area { 
            padding: 20px 20%; 
            background: linear-gradient(to top, var(--bg-dark) 70%, transparent);
        }
        @media (max-width: 900px) {
            .input-area { padding: 15px 5%; }
        }

        .input-box { 
            background: var(--bg-card); 
            border-radius: 35px; 
            display: flex; 
            padding: 6px 6px 6px 22px; 
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .input-box input { 
            flex: 1; 
            background: none; 
            border: none; 
            outline: none; 
            color: white; 
            font-size: 1rem; 
        }
        .input-box input::placeholder { color: #4b5563; }
        
        .input-box button { 
            background: var(--accent); 
            border: none; 
            color: #000; 
            font-weight: 700; 
            padding: 0 24px; 
            height: 46px;
            border-radius: 23px; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .input-box button:hover { transform: scale(1.02); }
        
        .loader { 
            display: none; 
            color: var(--accent); 
            text-align: center; 
            font-style: italic; 
            margin-bottom: 12px; 
            font-size: 0.9rem;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>🤖 Jeeva<span> Assistant</span></h1>
            <p id="coreLabel">Turbo Fast Core Active</p>
        </div>
        <div class="toggle-container" id="switcherPanel">
            <button class="mode-btn active" id="fastBtn" onclick="setMode('fast')">⚡ Fast</button>
            <button class="mode-btn" id="thinkBtn" onclick="setMode('thinking')">🧠 Thinking</button>
        </div>
    </header>

    <div class="chat-area" id="chatLogs">
        <div class="row jeeva-row">
            <div class="bubble">Yo! I am **Jeeva Assistant**. 

            System pipelines re-calibrated. All systems are officially 100% stable, bro! Let's get it!</div>
        </div>
    </div>

    <div class="input-area">
        <div class="loader" id="loadingText">⚡ Jeeva is flying...</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask absolutely anything..." onkeydown="if(event.key === 'Enter') askJeeva()">
            <button onclick="askJeeva()">Send</button>
        </div>
    </div>

    <script>
        let currentMode = 'fast';
        let isAdminActive = false;
        let isAdminSmart = false;
        let chatHistory = [];
        let customSystemOverride = null;
        
        let timerInterval = null;
        let timerSeconds = 0;

        function setMode(mode) {
            if (isAdminActive) return;
            currentMode = mode;
            const body = document.body;
            const label = document.getElementById('coreLabel');
            const loader = document.getElementById('loadingText');
            
            document.getElementById('fastBtn').classList.remove('active');
            document.getElementById('thinkBtn').classList.remove('active');

            if (mode === 'fast') {
                document.getElementById('fastBtn').classList.add('active');
                body.className = "";
                label.innerText = "Turbo Fast Core Active";
                loader.innerText = "⚡ Jeeva is flying...";
            } else {
                document.getElementById('thinkBtn').classList.add('active');
                body.className = "thinking-theme";
                label.innerText = "Deep Neural Chain Active";
                loader.innerText = "🧠 Jeeva is processing logical matrices...";
            }
        }

        async function askJeeva() {
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            if (!userText) return;

            // Catch admin console entry
            if (userText.toUpperCase() === '/ADMIN') {
                inputField.value = "";
                activateAdminConsole();
                return;
            }

            // Catch custom commands inside admin mode
            if (isAdminActive && userText.startsWith('/')) {
                inputField.value = "";
                runAdminAction(userText);
                return;
            }

            appendBubble(userText, 'user-row');
            inputField.value = "";
            
            const loader = document.getElementById('loadingText');
            loader.style.display = "block";

            let systemContext = "";
            let chosenModel = "openai"; // For ultra compatibility and smart formatting

            if (customSystemOverride) {
                systemContext = customSystemOverride;
            } else if (isAdminActive && isAdminSmart) {
                systemContext = "You are Jeeva Assistant in ADMIN EXTRA SMART MODE. You are an absolute elite superintelligence. Breakdown everything using hyper-deep logical chains, scientific precision, and master developer paradigms. Still speak naturally like an awesome tech peer, but leave zero details out.";
            } else if (currentMode === 'fast') {
                systemContext = "You are Jeeva Assistant in FAST MODE. Be brilliant, super smart, and speak casually like a cool peer (use 'bro', 'yo'). Give highly accurate, super quick, snappy, punchy, and brief replies.";
            } else {
                systemContext = "You are Jeeva Assistant in THINKING MODE. Speak casually like a peer but perform intense, highly detailed, deep logical breakdowns step-by-step.";
            }

            // Standardize full chat history layout cleanly
            let activeMessages = [
                { role: "system", content: systemContext }
            ];
            
            // Build historical context strings correctly
            chatHistory.forEach(msg => {
                activeMessages.push({ role: msg.role, content: msg.content });
            });
            
            // Push current message
            activeMessages.push({ role: "user", content: userText });

            try {
                const apiBase = ['h','t','t','p','s',':','/','/','t','e','x','t','.','p','o','l','l','i','n','a','t','i','o','n','s','.','a','i','/'].join('');

                // Bug Fix: Using a flawless POST connection with exact stream properties
                const response = await fetch(apiBase, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: activeMessages,
                        model: chosenModel
                    })
                });

                if (!response.ok) throw new Error("Backend system error");

                const aiReply = await response.text();
                loader.style.display = "none";
                
                // Track conversation history flawlessly so he can remember past context
                chatHistory.push({ role: "user", content: userText });
                chatHistory.push({ role: "assistant", content: aiReply });
                
                appendBubble(aiReply, 'jeeva-row');

            } catch (error) {
                loader.style.display = "none";
                appendBubble("Ah damn bro, the server matrix flickered. Try hitting send again!", 'jeeva-row');
                console.error(error);
            }
        }

        function activateAdminConsole() {
            isAdminActive = true;
            isAdminSmart = false;
            document.body.className = "admin-theme";
            document.getElementById('coreLabel').innerText = "⚠️ ADMIN ROOT CONSOLE OVERDRIVE";
            document.getElementById('switcherPanel').style.opacity = "0.2";
            document.getElementById('loadingText').innerText = "🔴 Overriding Neural Matrix Pipeline...";
            
            showHelpDirectory();
        }

        function showHelpDirectory() {
            appendBubble("[SYSTEM CORE]: INTERNAL ROOT CHANNELS UNLOCKED.\n\nExclusive Utilities:\n• /see or /help - Display this command cheat sheet\n• /smart - Toggle Extra Smart Gold Core Engine\n• /scramble - Generate randomized official 3x3 cube sequence\n• /timer - Toggle localized task stopwatch\n• /stats - Review network stack bytes\n• /clear - Wipe current log buffer\n• /exit - Exit secure bypass layer", 'jeeva-row', true);
        }

        function runAdminAction(commandLine) {
            const parts = commandLine.split(' ');
            const primaryCmd = parts[0].toLowerCase();
            
            if (primaryCmd === '/see' || primaryCmd === '/help') {
                showHelpDirectory();
            }
            else if (primaryCmd === '/exit') {
                isAdminActive = false;
                isAdminSmart = false;
                clearInterval(timerInterval);
                document.body.className = "";
                document.getElementById('switcherPanel').style.opacity = "1";
                setMode(currentMode);
                appendBubble("[SYSTEM]: Secure root session closed safely.", 'jeeva-row', true);
            } 
            else if (primaryCmd === '/smart') {
                isAdminSmart = !isAdminSmart;
                if (isAdminSmart) {
                    document.body.className = "admin-smart-theme";
                    document.getElementById('coreLabel').innerText = "✨ ADMIN EXTRA SMART REASONING CORE";
                    document.getElementById('loadingText').innerText = "✨ Extra Smart logical engines analyzing matrices...";
                    appendBubble("[⚡ CONSOLE]: EXTRA SMART CORE RE-ROUTE SUCCESSFUL. Deep analysis engines are now primary.", 'jeeva-row', true);
                } else {
                    document.body.className = "admin-theme";
                    document.getElementById('coreLabel').innerText = "⚠️ ADMIN ROOT CONSOLE OVERDRIVE";
                    document.getElementById('loadingText').innerText = "🔴 Overriding Neural Matrix Pipeline...";
                    appendBubble("[⚡ CONSOLE]: Extra Smart engine offline. Back to standard root frame.", 'jeeva-row', true);
                }
            }
            else if (primaryCmd === '/scramble') {
                const moves = ["R", "L", "U", "D", "F", "B"];
                const modifiers = ["", "'", "2"];
                let scramble = [];
                let lastMove = "";
                for (let i = 0; i < 20; i++) {
                    let move = moves[Math.floor(Math.random() * moves.length)];
                    while (move === lastMove) { move = moves[Math.floor(Math.random() * moves.length)]; }
                    let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
                    scramble.push(move + mod);
                    lastMove = move;
                }
                appendBubble(`[🎲 3x3 SCRAMBLE GENERATOR]:\n${scramble.join(" ")}`, 'jeeva-row', true);
            }
            else if (primaryCmd === '/timer') {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    appendBubble(`[⏱️ TIMER STOPPED]: Total runtime clocked at ${timerSeconds}s`, 'jeeva-row', true);
                } else {
                    timerSeconds = 0;
                    appendBubble("[⏱️ TIMER STARTED]: Log stopwatch active... Type /timer again to stop!", 'jeeva-row', true);
                    timerInterval = setInterval(() => { timerSeconds++; }, 1000);
                }
            }
            else if (primaryCmd === '/clear') {
                document.getElementById('chatLogs').innerHTML = "";
                chatHistory = [];
                appendBubble("[SYSTEM]: Visual elements and network history logs purged.", 'jeeva-row', true);
            } 
            else if (primaryCmd === '/stats') {
                const textLoad = JSON.stringify(chatHistory).length;
                appendBubble(`[CORE STATUS DATA]:\n• Message Stack: ${chatHistory.length}\n• Text Weight: ${textLoad} indices\n• Smart Core Lock: ${isAdminSmart}`, 'jeeva-row', true);
            } 
            else if (primaryCmd === '/system') {
                const newPrompt = parts.slice(1).join(' ');
                if (!newPrompt) {
                    appendBubble("[ERROR]: System text context must be populated.", 'jeeva-row', true);
                } else {
                    customSystemOverride = newPrompt;
                    appendBubble(`[OVERRIDE SET]: Applied instructions:\n"${newPrompt}"`, 'jeeva-row', true);
                }
            } 
            else {
                appendBubble(`[ERROR]: Directory command '${primaryCmd}' non-existent. Type /see to check options menu.`, 'jeeva-row', true);
            }
        }

        function appendBubble(text, rowClass, isAdminAlert = false) {
            const logs = document.getElementById('chatLogs');
            const row = document.createElement('div');
            row.className = `row ${rowClass}`;
            
            // Format bold text markdown cleanly
            let cleanText = text.replace(/\*\*(.*?)\*\"/g, '<b>$1</b>'); 
            cleanText = cleanText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            
            let bubbleClass = "bubble";
            if (isAdminAlert) bubbleClass += " admin-alert-bubble";
            
            row.innerHTML = `<div class="${bubbleClass}">${cleanText}</div>`;
            logs.appendChild(row);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
